<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Endorsement Dashboard</title>
<link rel="icon" type="image/jpeg" href="chinhock-logo.jpg">
<link rel="apple-touch-icon" href="chinhock-logo.jpg">
<meta name="theme-color" content="#16273f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Endorsement">

<style>
:root{
  --navy:#16273f; --navy-2:#1f3656; --navy-3:#2c4a73; --navy-soft:#3d5a82;
  --ink:#16273f; --ink-soft:#566476; --ink-faint:#8593a3;
  --line:rgba(40,70,110,.14);
  --accent:#2c4a73;
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.82);
  --radius:20px; --radius-sm:13px;
  --shadow:0 8px 28px rgba(22,39,63,.1), inset 0 1px 1px rgba(255,255,255,.7);
  --shadow-lift:0 16px 42px rgba(22,39,63,.18), inset 0 1px 1px rgba(255,255,255,.85);
  --e-new:#3d5a82;--e-new-bg:rgba(61,90,130,.15);
  --e-followup:#b16f62;--e-followup-bg:rgba(177,111,98,.16);
  --e-submitted:#4a90a4;--e-submitted-bg:rgba(74,144,164,.16);
  --e-pendingdone:#a8843f;--e-pendingdone-bg:rgba(168,132,63,.15);
  --e-pendingpay:#5b62a6;--e-pendingpay-bg:rgba(91,98,166,.15);
  --e-pendingletter:#9a8255;--e-pendingletter-bg:rgba(173,148,98,.16);
  --e-pendingsigned:#7d6aa8;--e-pendingsigned-bg:rgba(125,106,168,.16);
  --e-pendingdoc:#4a7a8c;--e-pendingdoc-bg:rgba(74,122,140,.16);
  --e-onhold:#78716c;--e-onhold-bg:rgba(120,113,108,.15);
  --e-cancelled:#a13a3a;--e-cancelled-bg:rgba(161,58,58,.15);
  --e-done:#5f8a5f;--e-done-bg:rgba(95,138,95,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1100px 700px at 8% -10%, #d8e4f2 0%, transparent 55%),
    radial-gradient(1000px 800px at 100% 0%, #e3e2ef 0%, transparent 50%),
    radial-gradient(900px 700px at 60% 120%, #dde9e6 0%, transparent 55%),
    linear-gradient(180deg,#eaeff5,#e3e9f1);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.72);box-shadow:var(--shadow)}
.lift{transition:transform .28s cubic-bezier(.2,.9,.25,1),box-shadow .28s ease;cursor:pointer}
.lift:hover{transform:scale(1.012) translateY(-2px);box-shadow:var(--shadow-lift);background:var(--glass-strong)}
.lift:active{transform:scale(.992)}

.app{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;position:sticky;top:0;height:100vh;padding:22px 16px;
  display:flex;flex-direction:column;gap:5px;
  background:linear-gradient(170deg,rgba(31,54,86,.94),rgba(18,32,52,.96));
  backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);
  border-right:1px solid rgba(255,255,255,.1);box-shadow:6px 0 30px rgba(22,39,63,.16)}
.sb-brand{display:flex;flex-direction:column;align-items:stretch;gap:8px;padding:4px 4px 16px}
.sb-logo-img{width:68%;display:block;margin:0 auto;background:#fff;border-radius:12px;padding:10px 12px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.sb-cap{font-size:10px;font-weight:700;color:rgba(255,255,255,.55);text-align:center;letter-spacing:.6px;text-transform:uppercase}
.nav-i{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;cursor:pointer;
  color:rgba(255,255,255,.72);font-size:13.5px;font-weight:540;transition:.2s;border:1px solid transparent}
.nav-i .ic{width:19px;text-align:center;font-size:15px;opacity:.9}
.nav-i:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-i.on{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.1);box-shadow:inset 0 1px 1px rgba(255,255,255,.12)}
.nav-i .badge{margin-left:auto;font-size:10.5px;font-weight:700;background:var(--e-followup);color:#fff;border-radius:9px;padding:1px 7px;min-width:18px;text-align:center}
.sb-new{margin-top:8px;border:0;cursor:pointer;font:inherit;font-size:13.5px;font-weight:600;color:#fff;padding:12px;border-radius:13px;
  background:linear-gradient(145deg,#4a72a8,#345788);box-shadow:0 4px 14px rgba(0,0,0,.22),inset 0 1px 1px rgba(255,255,255,.25);transition:.2s}
.sb-new:hover{transform:translateY(-1px)}
.sb-foot{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px;padding-top:14px}
.sb-foot button{flex:1;border:0;background:rgba(255,255,255,.1);color:rgba(255,255,255,.8);cursor:pointer;font:inherit;font-size:11.5px;font-weight:560;padding:9px;border-radius:11px;transition:.2s}
.whoami{width:100%;text-align:center;font-size:10.5px;color:rgba(255,255,255,.55);cursor:pointer;padding:4px;text-decoration:underline dotted}
.whoami:hover{color:rgba(255,255,255,.85)}
.sb-foot button:hover{background:rgba(255,255,255,.18)}

.content{flex:1;min-width:0;padding:26px 30px 70px}
.c-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.c-head .titles h2{font-size:24px;font-weight:700;letter-spacing:-.5px;color:var(--navy)}
.c-head .titles p{font-size:13px;color:var(--ink-soft);margin-top:3px}
.c-head .today{text-align:right;font-size:12px;color:var(--ink-soft)}
.c-head .today b{display:block;font-size:14px;color:var(--navy);font-weight:640}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.metric{border-radius:var(--radius);padding:16px 18px}
.metric .mlab{font-size:11px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.metric .mval{font-size:28px;font-weight:760;letter-spacing:-1px;color:var(--navy);font-variant-numeric:tabular-nums}
.metric .msub{font-size:11.5px;color:var(--ink-faint);margin-top:4px}
.metric.m-attn .mval{color:var(--e-followup)}
.metric.m-prog .mval{color:var(--e-submitted)}
.metric.m-done .mval{color:var(--e-done)}

.filters{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters select{font:inherit;font-size:13.5px;font-weight:560;color:var(--navy);background:var(--glass-strong);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:10px 14px;cursor:pointer;box-shadow:var(--shadow);outline:none}
.co-filter{position:relative;flex:1;min-width:190px;max-width:320px}
.co-filter input{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;background:#fff;color:var(--ink)}
.co-filter input:focus{outline:2px solid var(--accent);outline-offset:1px}
.co-filter .clr{position:absolute;right:9px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:15px;padding:2px 5px}
.seg{display:inline-flex;flex-wrap:wrap;gap:3px;background:var(--glass-strong);border:1px solid rgba(255,255,255,.7);border-radius:12px;padding:3px;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:560;color:var(--ink-soft);padding:7px 13px;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap}
.seg button.on{background:linear-gradient(145deg,#3d5a82,#2c4a73);color:#fff}
.stabs{margin-bottom:16px;gap:5px;padding:4px}
.stabs button{display:inline-flex;align-items:center;gap:6px}
.stabs button.zero{opacity:.45}
.stabs button.on.zero{opacity:1}
.stabs .tcount{font-size:11px;font-weight:700;padding:1.5px 7px;border-radius:9px;background:rgba(22,39,63,.07);color:var(--ink-faint);min-width:8px;text-align:center}
.stabs button.on .tcount{background:rgba(255,255,255,.25)!important;color:#fff!important}
.stabs-select{border:0;background:transparent;font:inherit;font-size:12.5px;font-weight:560;color:var(--ink-soft);padding:7px 10px;border-radius:9px;cursor:pointer;max-width:240px}
.stabs-select:hover{background:rgba(22,39,63,.05)}
.stabs-select:focus{outline:2px solid var(--accent);outline-offset:1px}

.sect-head{font-size:12px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.5px;margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
.sect-head .cnt{background:rgba(40,70,110,.08);border-radius:9px;padding:1px 8px;font-size:11px}
.list{display:flex;flex-direction:column;gap:10px}
.tbl{border-radius:var(--radius);overflow:hidden;background:rgba(255,255,255,.5);border:1px solid var(--line);margin-bottom:10px}
.trow{display:grid;grid-template-columns:.85fr 1.3fr .9fr 1.1fr 1.2fr .8fr .8fr .9fr;gap:12px;align-items:center;padding:13px 18px;border-bottom:1px solid var(--line);cursor:pointer;transition:.15s}
.trow:last-child{border-bottom:0}
.trow:not(.head):hover{background:rgba(255,255,255,.75)}
.trow.stale-alert{background:rgba(177,111,98,.07)}
.trow.stale-alert:not(.head):hover{background:rgba(177,111,98,.13)}
.trow.head{cursor:default;background:rgba(22,39,63,.04);font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-faint);padding:10px 18px}
.trow .tplate{font-size:14px;font-weight:660;color:var(--navy)}
.trow .tplate small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-soft);margin-top:1px}
.trow .tcell{font-size:12.5px;color:var(--ink-soft)}
.trow .tcell b{color:var(--ink);font-weight:600}
.trow .tdate{font-size:11px;color:var(--ink-faint);margin-top:4px}
.trow.head .sortable{cursor:pointer;display:flex;align-items:center;gap:4px;user-select:none;transition:.15s}
.trow.head .sortable:hover{color:var(--navy)}
.sort-ic{font-size:9px;opacity:.45}
.sort-ic.on{opacity:1;color:var(--accent)}
.tbl-cards{display:none}
@media(max-width:900px){.tbl{display:none}.tbl-cards{display:flex;flex-direction:column;gap:10px}}
.card{border-radius:var(--radius);padding:14px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;border-left:4px solid var(--line)}
.card.st-new{border-left-color:var(--e-new)}
.card.st-followup{border-left-color:var(--e-followup)}
.card.st-submitted{border-left-color:var(--e-submitted)}
.card.st-pendingdone{border-left-color:var(--e-pendingdone)}
.card.st-pendingpay{border-left-color:var(--e-pendingpay)}
.card.st-pendingletter{border-left-color:var(--e-pendingletter)}
.card.st-pendingsigned{border-left-color:var(--e-pendingsigned)}
.card.st-pendingdoc{border-left-color:var(--e-pendingdoc)}
.card.st-onhold{border-left-color:var(--e-onhold)}
.card.st-cancelled{border-left-color:var(--e-cancelled);opacity:.7}
.card.st-done{border-left-color:var(--e-done);opacity:.78}
.card.stale-alert{border-left-color:var(--e-followup)!important;background:rgba(177,111,98,.07)}
.pipe-board{display:flex;gap:14px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.pipe-col{flex:0 0 300px;min-width:300px;display:flex;flex-direction:column;gap:10px;background:rgba(255,255,255,.35);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.pipe-col-head{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.4px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.pipe-col-head .cnt{background:rgba(22,39,63,.08);border-radius:9px;padding:1px 8px;font-size:11px;color:var(--ink)}
.pipe-col-body{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 250px);overflow-y:auto}
.pipe-col-body .card.pipe-card-mini{padding:11px 14px}
.pipe-empty{font-size:12px;color:var(--ink-faint);text-align:center;padding:24px 0}
@media(max-width:900px){.pipe-col{flex-basis:82vw;min-width:82vw}}
.cmain{flex:1;min-width:0}
.cmain h3{font-size:16px;font-weight:660;color:var(--navy);display:inline}
.type-pill{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;margin-left:8px;vertical-align:middle;font-weight:600;background:rgba(44,74,115,.1);color:var(--navy)}
.tnc-icon{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:var(--e-pendingdone-bg);color:var(--e-pendingdone);font-size:10px;font-weight:800;cursor:pointer;margin-left:6px;vertical-align:middle;flex-shrink:0}
.tnc-icon:hover{background:var(--e-pendingdone);color:#fff}
.notice-red{color:var(--e-followup);font-size:12.5px;font-weight:650;text-align:center;line-height:1.6;margin-bottom:14px;padding:2px 4px}
.cmeta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{font-size:11.5px;color:var(--ink-soft);background:rgba(255,255,255,.55);border:1px solid var(--line);border-radius:8px;padding:3px 9px;display:inline-flex;gap:5px;align-items:center}
.tag b{color:var(--ink);font-weight:600}
.cdesc{font-size:12.5px;color:var(--ink-soft);margin-top:8px;border-left:3px solid var(--line);padding-left:9px;white-space:pre-line}
.cright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.status-badge{font-size:11.5px;font-weight:700;padding:5px 12px;border-radius:20px;white-space:nowrap}
.b-new{background:var(--e-new-bg);color:var(--e-new)}
.b-followup{background:var(--e-followup-bg);color:var(--e-followup)}
.b-submitted{background:var(--e-submitted-bg);color:var(--e-submitted)}
.b-pendingdone{background:var(--e-pendingdone-bg);color:var(--e-pendingdone)}
.b-pendingpay{background:var(--e-pendingpay-bg);color:var(--e-pendingpay)}
.b-pendingletter{background:var(--e-pendingletter-bg);color:var(--e-pendingletter)}
.b-pendingsigned{background:var(--e-pendingsigned-bg);color:var(--e-pendingsigned)}
.b-pendingdoc{background:var(--e-pendingdoc-bg);color:var(--e-pendingdoc)}
.b-onhold{background:var(--e-onhold-bg);color:var(--e-onhold)}
.b-cancelled{background:var(--e-cancelled-bg);color:var(--e-cancelled)}
.b-done{background:var(--e-done-bg);color:var(--e-done)}
.b-urgent{background:var(--e-followup-bg)!important;color:var(--e-followup)!important}
.new-tag{display:inline-block;margin-left:6px;font-size:9.5px;font-weight:800;letter-spacing:.3px;color:#fff;background:var(--e-followup);padding:1.5px 6px;border-radius:7px;vertical-align:middle}
.cage{font-size:11px;color:var(--ink-faint)}

.empty{text-align:center;color:var(--ink-soft);padding:48px 20px;border-radius:var(--radius)}
.empty .ic{font-size:30px;opacity:.5;margin-bottom:8px}

.scrim{position:fixed;inset:0;background:rgba(22,39,63,.36);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.3s;z-index:40}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);z-index:50;
  background:rgba(247,250,253,.93);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-left:1px solid rgba(255,255,255,.7);box-shadow:-20px 0 60px rgba(22,39,63,.22);
  transform:translateX(102%);transition:transform .38s cubic-bezier(.22,.85,.25,1);overflow-y:auto}
.sheet.show{transform:translateX(0)}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:18px 22px;background:rgba(247,250,253,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:19px;font-weight:700;letter-spacing:-.3px;color:var(--navy)}
.sheet-h .sub{font-size:12.5px;color:var(--ink-soft);margin-top:1px}
.x{border:0;background:rgba(40,70,110,.1);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:17px;color:var(--ink-soft);transition:.2s}
.x:hover{background:rgba(40,70,110,.18)}
.sheet-h-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.hsave{border:0;cursor:pointer;font:inherit;font-size:13px;font-weight:650;color:#fff;padding:9px 16px;border-radius:11px;background:linear-gradient(145deg,#4a72a8,#345788);box-shadow:0 4px 12px rgba(44,74,115,.28);transition:.2s}
.hsave:hover{transform:translateY(-1px)}.hsave:active{transform:scale(.97)}
.sheet-b{padding:20px 22px 50px}
.sect{margin-bottom:14px;background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:16px;padding:15px 16px 5px;box-shadow:0 1px 3px rgba(22,39,63,.04)}
.sect>label.h{display:block;font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:var(--navy);margin:0 0 13px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.fld{margin-bottom:11px}
.fld label{display:block;font-size:12px;color:var(--ink-soft);margin:0 2px 5px;font-weight:550}
.fld-label-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 5px}
.fld-label-row label{margin:0}
.copy-pic{border:0;background:rgba(61,90,130,.12);color:var(--navy);cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:8px;transition:.15s;white-space:nowrap}
.copy-pic:hover{background:rgba(61,90,130,.22)}
.done-msg-icon{border:0;background:var(--e-done-bg);color:var(--e-done);cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:8px;transition:.15s;white-space:nowrap}
.done-msg-icon:hover{background:var(--e-done);color:#fff}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:14px;color:var(--ink);background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:12px;padding:11px 13px;transition:.2s;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--navy-soft);background:#fff;box-shadow:0 0 0 3.5px rgba(44,74,115,.16)}
.date-hint{font-size:11px;color:var(--ink-faint);margin:4px 2px 0}
.fld textarea{resize:vertical;min-height:62px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.hint{font-size:11px;color:var(--ink-faint);margin:4px 2px 0}
.openlink{float:right;font-size:11px;color:var(--accent);font-weight:700;text-decoration:none}
.bigbtn{width:100%;border:0;cursor:pointer;font:inherit;font-size:14px;font-weight:620;color:#fff;padding:13px;border-radius:14px;background:linear-gradient(145deg,#4a72a8,#345788);box-shadow:0 6px 16px rgba(44,74,115,.28);transition:.2s;margin-top:4px}
.bigbtn:hover{transform:translateY(-1px)}.bigbtn:active{transform:scale(.99)}
.bigbtn.danger{background:rgba(177,111,98,.14);color:var(--e-followup);box-shadow:none;margin-top:10px}
.mini{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:600;padding:9px 14px;border-radius:11px;transition:.2s;background:rgba(40,70,110,.1);color:var(--navy)}
.mini:hover{background:rgba(40,70,110,.18)}
.mini.go{background:linear-gradient(145deg,#4a72a8,#345788);color:#fff}
.mini.undo{background:rgba(40,70,110,.12);color:var(--ink-soft)}
.import-btn{display:block;width:100%;text-align:center;background:var(--navy);color:#fff;box-shadow:var(--shadow)}
.import-btn:hover{opacity:.88}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(22,39,63,.94);color:#fff;font-size:13px;font-weight:560;padding:12px 22px;border-radius:14px;z-index:90;opacity:0;transition:.3s;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.demo-banner{font-size:12px;color:var(--e-pendingdone);background:var(--e-pendingdone-bg);border-radius:12px;padding:9px 14px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.demo-banner button{border:0;background:rgba(255,255,255,.6);cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;color:var(--ink-soft);padding:6px 12px;border-radius:9px}
input[type=file]{display:none}

@media (max-width:900px){
  .app{flex-direction:column}

/* NCD Withdrawal Calculator tool — own color vars (--nc-*) and class
   prefix (.ncd-*) so it never collides with the main app's styling. */
:root{
  --nc-navy:#1a2744;--nc-navy-mid:#243460;--nc-gold:#c8a84b;--nc-gold-light:#e8d48a;
  --nc-cream:#fdf8ee;--nc-cream-dark:#f5edda;--nc-red:#c0392b;--nc-green:#1a6b3c;
  --nc-border:#d9c98a;--nc-text-muted:#6b7280;--nc-white:#ffffff;
}
.ncd-wrap{max-width:920px}
.ncd-card{background:var(--nc-white);border:1px solid var(--nc-border);border-radius:10px;overflow:hidden;margin-bottom:20px;box-shadow:0 2px 8px rgba(26,39,68,.07)}
.ncd-card-header{background:var(--nc-navy);padding:12px 20px;display:flex;align-items:center;gap:10px}
.ncd-card-header .ncd-icon{width:28px;height:28px;background:var(--nc-gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.ncd-card-header h2{font-size:13px;font-weight:600;color:var(--nc-white);letter-spacing:.06em;text-transform:uppercase}
.ncd-card-body{padding:20px}
.ncd-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 20px}
.ncd-form-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
.ncd-field label{display:block;font-size:11px;font-weight:600;color:var(--nc-navy-mid);letter-spacing:.07em;text-transform:uppercase;margin-bottom:5px}
.ncd-field label .ncd-req{color:var(--nc-red);margin-left:2px}
.ncd-field input,.ncd-field select{width:100%;padding:9px 12px;border:1.5px solid #d1c5a0;border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;color:var(--nc-navy);background:var(--nc-cream);transition:border-color .2s;outline:none}
.ncd-field input:focus,.ncd-field select:focus{border-color:var(--nc-navy-mid);background:var(--nc-white)}
.ncd-field .ncd-hint{font-size:10px;color:var(--nc-text-muted);margin-top:3px}
#ncdOtherInsurerWrap{display:none;margin-top:8px}
.ncd-result-panel{background:var(--nc-navy);border-radius:10px;overflow:hidden;margin-bottom:20px;box-shadow:0 4px 16px rgba(26,39,68,.18)}
.ncd-result-panel-header{background:var(--nc-gold);padding:12px 20px;display:flex;align-items:center;justify-content:space-between}
.ncd-result-panel-header h2{font-size:12px;font-weight:700;color:var(--nc-navy);letter-spacing:.08em;text-transform:uppercase}
.ncd-result-panel-header .ncd-badge{font-size:10px;background:var(--nc-navy);color:var(--nc-gold);padding:3px 10px;border-radius:20px;font-weight:600}
.ncd-result-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(255,255,255,.08)}
.ncd-result-block{background:var(--nc-navy);padding:18px 22px}
.ncd-result-block.accent{background:var(--nc-navy-mid)}
.ncd-result-block .rb-label{font-size:10px;color:#a0abc0;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.ncd-result-block .rb-value{font-size:26px;font-weight:700;color:var(--nc-gold);font-variant-numeric:tabular-nums}
.ncd-result-block .rb-sub{font-size:11px;color:#7a8fb0;margin-top:3px}
.ncd-breakdown-table{width:100%;border-collapse:collapse}
.ncd-breakdown-table td{padding:9px 22px;font-size:12px;border-bottom:1px solid rgba(255,255,255,.06);color:#c8d4e8}
.ncd-breakdown-table td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:500;color:var(--nc-white)}
.ncd-breakdown-table tr.highlight td{color:var(--nc-gold-light);font-weight:600;font-size:13px;background:rgba(200,168,75,.08)}
.ncd-breakdown-section-label{padding:8px 22px 4px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--nc-gold);font-weight:600;background:rgba(200,168,75,.06);border-bottom:1px solid rgba(200,168,75,.15)}
.ncd-empty-state{text-align:center;padding:40px 20px;color:#a0abc0}
.ncd-empty-state .big-icon{font-size:40px;margin-bottom:10px}
.ncd-empty-state p{font-size:13px}
.ncd-btn-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.ncd-btn{padding:10px 22px;border-radius:7px;font-family:'Inter',sans-serif;font-size:13px;font-weight:600;cursor:pointer;border:none;letter-spacing:.03em;transition:opacity .15s,transform .1s;display:flex;align-items:center;gap:7px}
.ncd-btn:hover{opacity:.88}.ncd-btn:active{transform:scale(.97)}
.ncd-btn-primary{background:var(--nc-navy);color:var(--nc-white)}
.ncd-btn-gold{background:var(--nc-gold);color:var(--nc-navy)}
.ncd-btn-green{background:var(--nc-green);color:var(--nc-white)}
.ncd-btn-outline{background:transparent;color:var(--nc-navy);border:1.5px solid var(--nc-navy)}
.ncd-btn-danger{background:var(--nc-red);color:var(--nc-white)}
.ncd-btn-sm{padding:7px 14px;font-size:12px}
.ncd-saved-item{background:var(--nc-white);border:1px solid var(--nc-border);border-radius:8px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ncd-saved-item:hover{border-color:var(--nc-navy-mid)}
.ncd-saved-item .si-plate{font-size:15px;font-weight:700;color:var(--nc-navy);letter-spacing:.05em}
.ncd-saved-item .si-name{font-size:11px;color:var(--nc-text-muted);margin-top:2px}
.ncd-saved-item .si-amount{font-size:14px;font-weight:700;color:var(--nc-green);text-align:right;white-space:nowrap}
.ncd-saved-item .si-amount .label{font-size:10px;font-weight:400;color:var(--nc-text-muted);display:block;text-align:right}
.ncd-insurer-badge{display:inline-block;background:var(--nc-cream-dark);border:1px solid var(--nc-border);padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;color:var(--nc-navy-mid)}
.ncd-ref-table{width:100%;border-collapse:collapse;font-size:12px}
.ncd-ref-table th{background:var(--nc-navy-mid);color:var(--nc-gold-light);padding:7px 12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:10px;text-align:left}
.ncd-ref-table td{padding:7px 12px;border-bottom:1px solid var(--nc-cream-dark);color:var(--nc-navy)}
.ncd-ref-table tr:nth-child(even) td{background:var(--nc-cream)}
.ncd-info-pill{display:inline-flex;align-items:center;gap:5px;background:var(--nc-cream-dark);border:1px solid var(--nc-border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--nc-navy-mid);font-weight:500;margin:3px 4px 3px 0}
.ncd-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;align-items:center;justify-content:center}
.ncd-modal-overlay.show{display:flex}
.ncd-modal-box{background:var(--nc-white);border-radius:12px;padding:28px;max-width:400px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,.25)}
.ncd-modal-box h3{font-size:16px;font-weight:700;color:var(--nc-navy);margin-bottom:6px}
.ncd-modal-box p{font-size:12px;color:var(--nc-text-muted);margin-bottom:20px}
.ncd-modal-btn-row{display:flex;gap:10px;flex-wrap:wrap}
.ncd-modal-btn-row .ncd-btn{flex:1;justify-content:center}
@media(max-width:600px){.ncd-form-grid{grid-template-columns:1fr}.ncd-form-grid.cols-3{grid-template-columns:1fr 1fr}.ncd-result-grid{grid-template-columns:1fr}}
</style>

// Date / util helpers

function toISO(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseISO(s){return s?new Date(s+'T00:00:00'):null}
function fmtLong(s){if(!s)return'—';const d=parseISO(s);const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];return String(d.getDate()).padStart(2,'0')+' '+MON[d.getMonth()]+' '+d.getFullYear()}
function daysUntil(iso){if(!iso)return null;const t=new Date();t.setHours(0,0,0,0);return Math.round((parseISO(iso)-t)/864e5)}
function nowStamp(){const d=new Date();return d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function uid(){return 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function money(n){return 'RM'+(+n||0).toFixed(2)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
// Bank Details used to be one combined string ("BankName - AcctNo (Holder)"). Cases created before
// 2026-08-10 only have that in c.bank — split it back into the 3 columns Teoh asked for so old data
// still shows up when a case is opened, without a separate DB migration.
function bankParts(c){
  if(c.bankHolder||c.bankName||c.bankAcctNo)return{bankHolder:c.bankHolder||'',bankName:c.bankName||'',bankAcctNo:c.bankAcctNo||''};
  const m=c.bank&&/^(.*) - (.*) \((.*)\)$/.exec(c.bank);
  if(m)return{bankName:m[1],bankAcctNo:m[2],bankHolder:m[3]};
  return{bankHolder:'',bankName:c.bank||'',bankAcctNo:''};
}

// ============================================================
// Shared data layer (Supabase) — single-row JSON blob + rev-based
// optimistic concurrency, same pattern as the Puspakom Dashboard app.
// ============================================================
let CASES=[],TRASH=[],ACTIVITY=[],TEAM_NAMES=[],CUSTOM_TYPES=[];
let currentRev=0,dirtyPending=false,savingInFlight=false,pollTimer=null;

function unwrapPayload(payload){
  if(Array.isArray(payload))return{cases:payload,trash:[],activity:[],teamNames:[],customTypes:[]};
  return{cases:Array.isArray(payload&&payload.cases)?payload.cases:[],
    trash:Array.isArray(payload&&payload.trash)?payload.trash:[],
    activity:Array.isArray(payload&&payload.activity)?payload.activity:[],
    teamNames:Array.isArray(payload&&payload.teamNames)?payload.teamNames:[],
    customTypes:Array.isArray(payload&&payload.customTypes)?payload.customTypes:[]};
}
async function loadFromServer(){
  const {data,error}=await sb.from('endorsement_state').select('rev,data').eq('id',1).single();
  if(error)throw error;
  const u=unwrapPayload(data.data);
  CASES=u.cases;TRASH=u.trash;ACTIVITY=u.activity;TEAM_NAMES=u.teamNames;CUSTOM_TYPES=u.customTypes;
  currentRev=data.rev||0;
}
function save(){dirtyPending=true;if(save._t)clearTimeout(save._t);save._t=setTimeout(pushNow,600);}
async function pushNow(){
  if(savingInFlight||!dirtyPending)return;
  savingInFlight=true;dirtyPending=false;
  try{
    const nextRev=currentRev+1;
    const {data,error}=await sb.from('endorsement_state')
      .update({data:{cases:CASES,trash:TRASH,activity:ACTIVITY,teamNames:TEAM_NAMES,customTypes:CUSTOM_TYPES},rev:nextRev,updated_at:new Date().toISOString(),updated_by:myName()||CURRENT_USER_EMAIL||'Unknown'})
      .eq('id',1).eq('rev',currentRev).select('rev,data');
    if(error){if(/JWT|auth|permission|token/i.test(error.message||''))showLogin('Login expired — please log in again');return;}
    if(!data||!data.length){
      const cur=await sb.from('endorsement_state').select('rev,data').eq('id',1).single();
      if(cur.data){const u=unwrapPayload(cur.data.data);CASES=u.cases;TRASH=u.trash;ACTIVITY=u.activity;TEAM_NAMES=u.teamNames;CUSTOM_TYPES=u.customTypes;currentRev=cur.data.rev||0;render();toast('⚠️ Data was updated by someone else — latest version loaded, please recheck your recent changes');}
      return;
    }
    currentRev=data[0].rev;
  }catch(e){/* offline — retried on next save() */}
  finally{savingInFlight=false;if(dirtyPending)pushNow();}
}
function startPolling(){
  if(pollTimer)clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    if(dirtyPending||savingInFlight||openId)return;
    try{
      const {data,error}=await sb.from('endorsement_state').select('rev,data').eq('id',1).single();
      if(error||!data)return;
      if((data.rev||0)!==currentRev){const u=unwrapPayload(data.data);CASES=u.cases;TRASH=u.trash;ACTIVITY=u.activity;TEAM_NAMES=u.teamNames;CUSTOM_TYPES=u.customTypes;currentRev=data.rev||0;render();}
    }catch(e){}
  },7000);
}

function showLogin(msg){const el=document.getElementById('loginOverlay');if(el){el.style.display='flex';const m=document.getElementById('loginMsg');if(m&&msg)m.textContent=msg;
  const em=document.getElementById('loginEmail');if(em&&!em.value)em.value=localStorage.getItem('ed_email')||'';

function hideLogin(){const el=document.getElementById('loginOverlay');if(el)el.style.display='none';}
async function submitLogin(){
  const email=(((document.getElementById('loginEmail')||{}).value)||'').trim();
  const name=(((document.getElementById('loginName')||{}).value)||'').trim();
  const pass=((document.getElementById('loginPass')||{}).value)||'';
  if(!email||!name||!pass){showLogin('Please enter email, your name, and password');return;}
  if(!sb){showLogin('Supabase is not configured yet — ask admin to finish setup');return;}
  const btn=document.getElementById('loginBtn');if(btn){btn.disabled=true;btn.textContent='Logging in…';}
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(btn){btn.disabled=false;btn.textContent='Log In';}
  if(error){showLogin('Login failed: '+(error.message||'Please check your email and password'));return;}
  localStorage.setItem('ed_email',email);localStorage.setItem(NAME_KEY,name);renderWhoAmI();hideLogin();boot();
}
async function logout(){try{await sb.auth.signOut();}catch(e){}if(pollTimer)clearInterval(pollTimer);showLogin('Logged out');}
async function boot(){
  try{
    if(!sb){showLogin('Supabase is not configured yet — ask admin to finish setup');return;}
    const {data:{session}}=await sb.auth.getSession();
    if(!session){showLogin('Please log in');return;}
    CURRENT_USER_EMAIL=(session.user&&session.user.email)||'';
    await loadFromServer();
    if(!isAdmin()){
      const nm=(myName()||'').trim().toLowerCase();
      const known=nm&&TEAM_NAMES.some(n=>n.toLowerCase()===nm);
      if(!known){
        await sb.auth.signOut();
        showLogin('That name isn\'t recognized yet — check the spelling, or ask admin to add it under Settings.');
        return;
      }
    }
    autoFollowUp();
    render();renderWhoAmI();startPolling();
    setTimeout(attemptSilentDriveReconnect,300);
  }catch(e){showLogin('Could not load data: '+((e&&e.message)||'Please try again later'));}
}

// ============================================================
// Auto follow-up rule: a case sitting in "submitted" for more than
// 2 days without moving forward gets auto-flagged for follow up.
// ============================================================
function autoFollowUp(){let ch=false;const today=toISO(new Date());
  CASES.forEach(c=>{
    if(c.status!=='submitted'||!c.submittedDate)return;
    const d=daysUntil(c.submittedDate);
    if(d!=null&&d<=-2){c.status='followup';ch=true;logActivity('Status changed',c.plate+' · Submitted → Follow Up (auto, no update in 2+ days)');}
  });
  if(ch)save();return ch;
}

function get(id){return CASES.find(c=>c.id===id)}
function delRecord(id){
  if(!isAdmin()){toast('Only admin can delete cases');return}
  if(!confirm('Delete this case? (can be restored from Trash later)'))return;
  const c=get(id);if(!c)return;
  c.deletedAt=nowStamp();c.deletedBy=myName()||CURRENT_USER_EMAIL||'Unknown';
  CASES=CASES.filter(x=>x.id!==id);
  TRASH.push(c);
  save();closeSheet();render();toast('Moved to Trash');
  logActivity('Deleted case',c.plate);
}
function restoreFromTrash(id){
  if(!isAdmin())return;
  const idx=TRASH.findIndex(c=>c.id===id);if(idx<0)return;
  const [c]=TRASH.splice(idx,1);delete c.deletedAt;delete c.deletedBy;
  CASES.push(c);save();render();toast('Restored '+c.plate);
  logActivity('Restored case',c.plate);
}
function permanentlyDelete(id){
  if(!isAdmin())return;
  if(!confirm('Permanently delete this case? This cannot be undone.'))return;
  const c=TRASH.find(x=>x.id===id);
  TRASH=TRASH.filter(x=>x.id!==id);save();render();toast('Permanently deleted');
  logActivity('Permanently deleted case',c?c.plate:id);
}

let driveTokenClient=null,driveAccessToken=null,driveTokenExpiry=0;
function driveReady(){return typeof google!=='undefined'&&google.accounts&&DRIVE_CLIENT_ID!=='REPLACE_WITH_GOOGLE_OAUTH_CLIENT_ID'}
function initDriveAuth(){
  if(!driveReady()||driveTokenClient)return;
  driveTokenClient=google.accounts.oauth2.initTokenClient({client_id:DRIVE_CLIENT_ID,scope:DRIVE_SCOPE,callback:()=>{}});

function updateDriveStatusUI(){

function connectDrive(){

    if(resp.error){toast('Could not connect Drive: '+resp.error);return}

    driveTokenExpiry=Date.now()+(resp.expires_in||3600)*1000-30000;
    updateDriveStatusUI();toast('Drive connected ✓');
  };
  driveTokenClient.requestAccessToken({prompt:driveAccessToken?'':'consent'});
}
function attemptSilentDriveReconnect(){
  if(!driveReady())return;
  initDriveAuth();
  driveTokenClient.callback=(resp)=>{if(!resp.error){driveAccessToken=resp.access_token;driveTokenExpiry=Date.now()+(resp.expires_in||3600)*1000-30000;updateDriveStatusUI();}};
  try{driveTokenClient.requestAccessToken({prompt:''});}catch(e){}
}
function ensureDriveToken(){
  return new Promise((resolve,reject)=>{
    if(!driveReady()){reject(new Error('Drive not set up'));return}
    if(driveAccessToken&&Date.now()<driveTokenExpiry){resolve(driveAccessToken);return}
    initDriveAuth();
    driveTokenClient.callback=(resp)=>{
      if(resp.error){reject(new Error(resp.error));return}
      driveAccessToken=resp.access_token;
      driveTokenExpiry=Date.now()+(resp.expires_in||3600)*1000-30000;
      updateDriveStatusUI();resolve(driveAccessToken);
    };
    driveTokenClient.requestAccessToken({prompt:''});
  });
}
async function driveFindFolder(token,name,parentId){
  const q=encodeURIComponent(`name contains '${name.replace(/'/g,"\\'")}' and '${parentId}' in parents and mimeType='application/vnd.google-apps.folder' and trashed=false`);
  const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`,{headers:{Authorization:'Bearer '+token}});
  if(!res.ok)throw new Error('Drive lookup failed ('+res.status+')');
  const data=await res.json();
  return data.files&&data.files.length?data.files[0].id:null;
}
async function driveCreateFolder(token,name,parentId){
  const res=await fetch('https://www.googleapis.com/drive/v3/files?fields=id,webViewLink',{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name,mimeType:'application/vnd.google-apps.folder',parents:[parentId]})
  });
  if(!res.ok)throw new Error('Drive folder creation failed ('+res.status+')');
  return res.json();
}
async function driveGetOrCreateFolder(token,name,parentId){
  const existing=await driveFindFolder(token,name,parentId);
  if(existing)return existing;
  const created=await driveCreateFolder(token,name,parentId);
  return created.id;
}
async function driveFileExistsInFolder(token,name,parentId){
  const q=encodeURIComponent(`name='${name.replace(/'/g,"\\'")}' and '${parentId}' in parents and trashed=false`);
  const res=await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`,{headers:{Authorization:'Bearer '+token}});
  if(!res.ok)return false;
  const data=await res.json();
  return !!(data.files&&data.files.length);
}
async function driveCopyFile(token,fileId,newName,parentId){
  const res=await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}/copy?fields=id`,{
    method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({name:newName,parents:[parentId]})
  });
  if(!res.ok)throw new Error('Drive file copy failed ('+res.status+')');
  return res.json();
}

// Finds/creates the case's Drive folder and fills in driveUrl — runs in
// the background (not awaited by the caller) so adding a case never
// blocks on a Drive round-trip; silently no-ops if Drive isn't
// connected, since driveUrl can always be filled in later via the
// "Create Drive Folder" button in the case's detail sheet.
// Shared by autoCreateDriveFolder (existing cases) and getDriveLinkForNewCase (still-being-drafted New Case form).
// Also auto-copies that insurer's Endorsement Form template into the case folder, for every endorsement
// type (not just Policy Cancellation) — skips insurers with no template on file (e.g. Zurich, for now),
// and skips re-copying if a file with that name is already there (so repeat clicks don't duplicate it).
async function resolveCaseDriveUrl(type,plate,enquiryDate,pic,ins){
  const token=await ensureDriveToken();
  const typeFolderName=TYPE_DRIVE_FOLDER[type]||type;
  const typeFolderId=await driveGetOrCreateFolder(token,typeFolderName,ENDORSEMENT_ROOT_ID);
  const caseFolderName=`${plate} ${enquiryDate?fmtLong(enquiryDate):fmtLong(toISO(new Date()))} ${pic||''}`.trim();
  const caseFolderId=await driveGetOrCreateFolder(token,caseFolderName,typeFolderId);
  const formFileId=ins&&INSURER_FORM_FILE[ins];
  if(formFileId){
    const formName='Endorsement Form.pdf';
    try{
      const exists=await driveFileExistsInFolder(token,formName,caseFolderId);
      if(!exists)await driveCopyFile(token,formFileId,formName,caseFolderId);
    }catch(e){/* non-fatal — case folder still gets created/linked either way */}
  }
  return `https://drive.google.com/drive/folders/${caseFolderId}`;
}
async function autoCreateDriveFolder(c,{silent}={}){
  try{
    c.driveUrl=await resolveCaseDriveUrl(c.type,c.plate,c.enquiryDate,c.pic,c.ins);
    save();
    if(CURVIEW==='dashboard')render();
    if(openId===c.id)renderSheet();
    toast('📁 Drive folder ready for '+c.plate);
  }catch(e){
    if(!silent)toast('Could not create Drive folder — connect Drive in Settings, or add the link manually');
  }
}
// "🔗 Get Drive Link" button in the New Case form — creates/finds the folder right away from whatever's
// currently typed in the form (case isn't saved yet) and fills the Drive Link field with it, so PIC can
// open it and start uploading documents before even hitting "Add case".
async function getDriveLinkForNewCase(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:''};
  const plate=g('n_plate').trim().toUpperCase();
  if(!plate){toast('Please enter a vehicle number first');return}
  const btn=document.getElementById('n_getDriveBtn');
  if(btn){btn.disabled=true;btn.textContent='📁 Creating…';}
  try{
    const type=readTypeValue('n_type')||TYPE_LIST[0];
    const pic=g('n_pic')||PIC_LIST[0];
    const enquiryDate=g('n_enquiryDate')||toISO(new Date());
    const ins=readInsValue('n_ins');
    const url=await resolveCaseDriveUrl(type,plate,enquiryDate,pic,ins);
    const urlInput=document.getElementById('n_driveUrl');if(urlInput)urlInput.value=url;
    // linkField() only renders the "Open ↗" link at initial render time, so patch it in directly here
    // rather than re-rendering the whole form (which would wipe out whatever the PIC has already typed).
    let openLink=document.getElementById('n_driveUrlOpen');
    if(!openLink&&urlInput){
      openLink=document.createElement('a');
      openLink.id='n_driveUrlOpen';openLink.className='openlink';openLink.target='_blank';openLink.rel='noopener';
      openLink.textContent='Open ↗';
      const label=urlInput.closest('.fld').querySelector('label');
      if(label)label.appendChild(openLink);
    }
    if(openLink)openLink.href=url;
    toast('📁 Drive folder ready — click "Open ↗" to upload documents');
  }catch(e){
    toast('Could not create Drive folder — connect Drive in Settings first');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🔗 Get Drive Link';}
  }
}

let fltSearch='',fltType='',fltPic='',fltIns='',activeStatusTab='all',searchTimer=null;
// Defaults to newest enquiry first — Teoh wants the freshest cases up top without having to click the header.
let dSortKey='enquiryDate',dSortDir=-1;
function setDSort(key){if(dSortKey===key){dSortDir=-dSortDir}else{dSortKey=key;dSortDir=1}render()}
function dSortIcon(key){if(dSortKey!==key)return '<span class="sort-ic">▽</span>';return dSortDir===1?'<span class="sort-ic on">▲</span>':'<span class="sort-ic on">▼</span>'}
function dSortVal(c,key){
  if(key==='status')return STATUS_CFG[c.status]?STATUS_CFG[c.status].order:0;
  if(key==='amount')return (+c.gross||0)+(+c.nett||0);
  if(key==='refund')return +c.refund||0;
  if(key==='refundDate')return (c.refundDate||'')+'';
  return (c[key]||'')+'';
}
function applyDSort(rows){
  if(!dSortKey)return rows;
  const k=dSortKey,dir=dSortDir;
  return [...rows].sort((a,b)=>{
    const va=dSortVal(a,k),vb=dSortVal(b,k);
    if(typeof va==='number'||typeof vb==='number')return (va-vb)*dir;
    return (''+va).localeCompare(''+vb)*dir;
  });
}
function setSearch(v){fltSearch=v.trim();clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>{
    const wasFocused=document.activeElement&&document.activeElement.id==='searchInput';
    render();

  },200);
}

  const typeOk=!fltType||c.type===fltType;
  const picOk=!fltPic||c.pic===fltPic;
  const insOk=!fltIns||c.ins===fltIns;
  return qOk&&typeOk&&picOk&&insOk;
}

function isDoneThisMonth(c){
  const basis=c.submittedDate||(c.createdAt?toISO(new Date(c.createdAt)):'');
  if(!basis)return false;
  const d=parseISO(basis),now=new Date();
  return d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth();
}
function ageLabel(c){
  const basis=c.enquiryDate||(c.createdAt?toISO(new Date(c.createdAt)):'');
  if(!basis)return'';
  const d=daysUntil(basis);
  if(d==null)return'';
  return d===0?'today':(-d)+'d ago';
}

function isFreshToday(c){return !!c.createdAt&&toISO(new Date(c.createdAt))===toISO(new Date())}

    ...(claim&&data.to_optional_claim_linked?data.to_optional_claim_linked:[]),

function viewDashboard(){
  const rows=filteredCases();
  const total=CASES.length;

  const inProgress=CASES.filter(c=>['submitted','pendingdone','pendingpay','pendingletter','pendingsigned','pendingdoc'].includes(c.status)).length;
  const doneThisMonth=CASES.filter(c=>c.status==='done'&&isDoneThisMonth(c)).length;
  const counts={};STATUS_ORDER.forEach(k=>counts[k]=CASES.filter(c=>c.status===k).length);

  const allTypes=[...new Set(CASES.map(c=>c.type).filter(Boolean))].sort();
  const allPics=[...new Set(CASES.map(c=>c.pic).filter(Boolean))].sort();
  const allIns=[...new Set(CASES.map(c=>c.ins).filter(Boolean))].sort();

  const metrics=`<div class="metrics">
    <div class="metric glass"><div class="mlab">Total Cases</div><div class="mval">${total}</div></div>
    <div class="metric glass m-attn"><div class="mlab">Need Attention</div><div class="mval">${needAttn}</div><div class="msub">Pending Proceed + Follow Up</div></div>
    <div class="metric glass m-prog"><div class="mlab">In Progress</div><div class="mval">${inProgress}</div><div class="msub">Submitted → Pending stages</div></div>
    <div class="metric glass m-done"><div class="mlab">Completed</div><div class="mval">${doneThisMonth}</div><div class="msub">Done this month</div></div>
  </div>`;

  const filters=`<div class="filters">
    <div class="co-filter"><input id="searchInput" type="text" placeholder="Search plate / insurance / remark…" value="${esc(fltSearch)}" oninput="setSearch(this.value)">${fltSearch?`<button class="clr" onclick="document.getElementById('searchInput').value='';clearSearch()">✕</button>`:''}</div>
    <select onchange="setFltType(this.value)"><option value="">All Types</option>${allTypes.map(t=>`<option value="${esc(t)}" ${t===fltType?'selected':''}>${esc(t)}</option>`).join('')}</select>
    <select onchange="setFltPic(this.value)"><option value="">All PIC</option>${allPics.map(p=>`<option value="${esc(p)}" ${p===fltPic?'selected':''}>${esc(p)}</option>`).join('')}</select>
    <select onchange="setFltIns(this.value)"><option value="">All Insurance</option>${allIns.map(i=>`<option value="${esc(i)}" ${i===fltIns?'selected':''}>${esc(i)}</option>`).join('')}</select>
  </div>`;

  // Only "All" stays as a tab button; every other status moved into a dropdown (still shows counts) so the
  // bar doesn't get crowded as more statuses get added — see Teoh's request 2026-07-31.
  const tabs=`<div class="seg stabs">
    <button class="${activeStatusTab==='all'?'on':''}" onclick="setStatusTab('all')">All <span class="tcount">${CASES.length}</span></button>
    <select class="stabs-select" onchange="setStatusTab(this.value)">
      <option value="" ${activeStatusTab==='all'?'selected':''} disabled>Filter by status…</option>
      ${STATUS_ORDER.map(k=>`<option value="${k}" ${activeStatusTab===k?'selected':''}>${STATUS_CFG[k].ic} ${STATUS_CFG[k].l} — ${counts[k]}</option>`).join('')}
    </select>
  </div>`;

  let body;
  if(!rows.length){
    body=`<div class="empty glass"><div class="ic">📭</div><div style="font-weight:640;color:var(--navy)">No cases match</div><div style="font-size:13px;margin-top:4px">Try clearing filters or add a new case.</div></div>`;
  }else if(activeStatusTab==='all'){
    body=STATUS_ORDER.map(k=>{
      const group=rows.filter(c=>c.status===k);
      if(!group.length)return'';
      return `<div class="sect-head">${STATUS_CFG[k].ic} ${STATUS_CFG[k].l} <span class="cnt">${group.length}</span></div>${tableBlock(group)}`;
    }).join('');
  }else{
    body=tableBlock(rows.filter(c=>c.status===activeStatusTab));
  }

  return metrics+filters+tabs+body;
}

let openId=null;
function field(label,id,val,type,opts){val=val==null?'':val;
  if(type==='select')return `<div class="fld"><label>${label}</label><select id="${id}">${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  if(type==='textarea')return `<div class="fld"><label>${label}</label><textarea id="${id}">${esc(val)}</textarea></div>`;
  // Chromium ignores lang="en-GB" on <input type=date> and always shows the browser's own locale order
  // (mm/dd/yyyy for US-locale Chrome) — no reliable cross-browser way to force the native picker itself
  // to DD/MM/YYYY, so a plain-language hint underneath (same "31 Jul 2026" style used everywhere else in
  // this app) is the fix: it's always unambiguous no matter how the native input renders.
  if(type==='date')return `<div class="fld"><label>${label}</label><input id="${id}" type="date" value="${val}" oninput="const h=document.getElementById('${id}Hint');if(h)h.textContent=this.value?fmtLong(this.value):''"><div class="date-hint" id="${id}Hint">${val?fmtLong(val):''}</div></div>`;

// Appends a dated "DD Mon YYYY : Follow up by <channel>" entry (plus whatever detail was typed) onto the
// existing Follow Up Note, building a running log instead of overwriting it each time.
function addFollowupLogEntry(){
  const by=document.getElementById('f_followupBy').value;
  if(!by){toast('Please choose Follow Up By first');return}
  const dateEl=document.getElementById('f_followupDate');
  const date=dateEl.value||toISO(new Date());
  if(!dateEl.value){dateEl.value=date;dateEl.dispatchEvent(new Event('input'));}
  const detail=document.getElementById('followupLogDetail').value.trim();
  const entry=`${fmtLong(date)} : Follow up by ${by}${detail?'\n'+detail:''}`;
  const noteEl=document.getElementById('f_followup');
  noteEl.value=(noteEl.value.trim()?noteEl.value.trim()+'\n\n':'')+entry;
  document.getElementById('followupLogDetail').value='';
  toast('Added to Follow Up Note');
}
function readSheet(){
  const c=get(openId);if(!c)return null;
  const g=id=>{const e=document.getElementById(id);return e?e.value:undefined};
  const LABEL_TO_KEY=Object.fromEntries(STATUS_ORDER.map(k=>[STATUS_CFG[k].l,k]));
  c.plate=(g('f_plate')||c.plate).trim().toUpperCase();
  c.contact=g('f_contact')||'';
  c.type=g('f_type')||c.type;
  c.ins=readInsValue('f_ins');
  c.pic=g('f_pic')||c.pic;
  c.enquiryDate=g('f_enquiryDate')||'';
  c.remark=g('f_remark')||'';
  const newStatus=LABEL_TO_KEY[g('f_status')]||c.status;
  if(newStatus!==c.status)logActivity('Status changed',`${c.plate} · ${STATUS_CFG[c.status].l} → ${STATUS_CFG[newStatus].l}`);
  c.status=newStatus;
  c.submittedDate=g('f_submittedDate')||'';
  c.followup=g('f_followup')||'';
  c.followupDate=g('f_followupDate')||'';
  c.followupBy=g('f_followupBy')||'';
  c.bankHolder=g('f_bankHolder')||'';
  c.bankName=g('f_bankName')||'';
  c.bankAcctNo=g('f_bankAcctNo')||'';
  c.refund=+g('f_refund')||0;
  c.gross=+g('f_gross')||0;
  c.nett=+g('f_nett')||0;
  c.refundDate=g('f_refundDate')||'';
  c.driveUrl=g('f_driveUrl')||'';
  return c;
}
function saveSheet(){
  const c=readSheet();if(!c)return;
  if(c.status==='done'&&REFUND_TYPES.has(c.type)&&!c.refundDate){
    c.status='followup';
    logActivity('Status changed',`${c.plate} · Done → Follow Up (auto, Refund Date not filled in)`);
    save();renderSheet();render();
    toast('⚠️ Refund Date is required to mark this type as Done — moved to Follow Up instead');
    logActivity('Edited case',c.plate);
    return;
  }
  save();renderSheet();render();toast('Saved');logActivity('Edited case',c.plate);
}

// Keeps whatever's typed in the New Case form even if the sheet gets closed (✕ or accidental navigation)
// before hitting "＋ Add case" — saved to localStorage (per-device, not synced) on every keystroke/change,
// restored the next time "New Case" is opened, and cleared once the case is actually saved.
const NEW_CASE_DRAFT_KEY='ed_new_case_draft';
function saveNewCaseDraft(){
  if(!document.getElementById('n_plate'))return;
  const g=id=>{const e=document.getElementById(id);return e?e.value:''};
  const draft={
    plate:g('n_plate'),contact:g('n_contact'),type:g('n_type'),typeNew:g('n_typeNewInput'),
    ins:g('n_ins'),insOther:g('n_insOtherInput'),pic:g('n_pic'),enquiryDate:g('n_enquiryDate'),
    remark:g('n_remark'),driveUrl:g('n_driveUrl'),
    bankHolder:g('n_bankHolder'),bankName:g('n_bankName'),bankAcctNo:g('n_bankAcctNo')
  };
  localStorage.setItem(NEW_CASE_DRAFT_KEY,JSON.stringify(draft));
}
function applyNewCaseDraft(){
  let draft;try{draft=JSON.parse(localStorage.getItem(NEW_CASE_DRAFT_KEY)||'null');}catch(e){draft=null;}
  if(!draft)return;
  const set=(id,val)=>{const e=document.getElementById(id);if(e&&val){e.value=val;e.dispatchEvent(new Event('input'));}};
  set('n_plate',draft.plate);set('n_contact',draft.contact);
  set('n_pic',draft.pic);set('n_enquiryDate',draft.enquiryDate);set('n_remark',draft.remark);
  set('n_driveUrl',draft.driveUrl);
  set('n_bankHolder',draft.bankHolder);set('n_bankName',draft.bankName);set('n_bankAcctNo',draft.bankAcctNo);
  const typeSel=document.getElementById('n_type');
  if(typeSel&&draft.type){typeSel.value=draft.type;typeSel.dispatchEvent(new Event('change'));}
  set('n_typeNewInput',draft.typeNew);
  const insSel=document.getElementById('n_ins');
  if(insSel&&draft.ins){insSel.value=draft.ins;insSel.dispatchEvent(new Event('change'));}
  set('n_insOtherInput',draft.insOther);
}
function clearNewCaseDraft(){localStorage.removeItem(NEW_CASE_DRAFT_KEY);}
function addNew(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:''};
  if(!g('n_plate').trim()){toast('Please enter a vehicle number');return}
  const typeSelEl=document.getElementById('n_type');
  if(typeSelEl&&typeSelEl.value===NEW_TYPE_OPT&&!g('n_typeNewInput').trim()){toast('Please type the new endorsement type name');return}
  const bankHolder=g('n_bankHolder').trim(),bankName=g('n_bankName').trim(),bankAcctNo=g('n_bankAcctNo').trim();
  const c={id:uid(),plate:g('n_plate').trim().toUpperCase(),contact:g('n_contact').trim(),type:readTypeValue('n_type')||TYPE_LIST[0],ins:readInsValue('n_ins'),
    pic:g('n_pic')||PIC_LIST[0],remark:g('n_remark').trim(),bankHolder,bankName,bankAcctNo,followup:'',followupDate:'',followupBy:'',status:'new',submittedDate:'',
    enquiryDate:g('n_enquiryDate')||toISO(new Date()),refund:0,refundDate:'',gross:0,nett:0,createdAt:Date.now(),driveUrl:g('n_driveUrl').trim(),demo:false};
  CASES.push(c);save();clearNewCaseDraft();closeSheet();switchView('dashboard');toast('Added '+c.plate);
  logActivity('Added new case',c.plate);
  if(!c.driveUrl)autoCreateDriveFolder(c,{silent:true});
}
// Notification message for whoever processes the case — format fixed by Teoh 2026-07-31:
// "Date : DD/MM/YYYY" (always today) then the endorsement type as a header, "1. PLATE | INSURER",
// then Contact Number and Drive Link each on their own bullet line.
function todayDDMMYYYY(){const d=new Date();return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();}
function buildNotifyMessage({type,plate,ins,contact,driveUrl}){
  return `Date : ${todayDDMMYYYY()}\n\n${type}\n1. ${plate} | ${ins||'-'}\n- ${contact||'-'}\n- ${driveUrl||'-'}`;
}
function copyNotifyMessageForNewCase(){
  const g=id=>{const e=document.getElementById(id);return e?e.value:''};
  const plate=g('n_plate').trim().toUpperCase();
  if(!plate){toast('Please enter a vehicle number first');return}
  const msg=buildNotifyMessage({
    type:readTypeValue('n_type')||TYPE_LIST[0],
    plate,
    ins:readInsValue('n_ins'),
    contact:g('n_contact').trim(),
    driveUrl:g('n_driveUrl').trim()
  });
  if(!navigator.clipboard||!navigator.clipboard.writeText){toast('Clipboard not available in this browser');return}
  navigator.clipboard.writeText(msg).then(()=>toast('📋 Message copied')).catch(()=>toast('Could not copy to clipboard'));
}

  const NCD_OPTIONS={car:['0','25','30','38.33','45','55'],motor:['0','15','20','25'],lorry:['0','15','20','25']};
  let savedRecords=[],lastResult=null,pendingPdfRecord=null,inited=false;
  function load(){try{savedRecords=JSON.parse(localStorage.getItem(STORE_KEY)||'[]')}catch(e){savedRecords=[]}}
  function persist(){localStorage.setItem(STORE_KEY,JSON.stringify(savedRecords))}
  function fmtDate(d){return d.toISOString().split('T')[0]}
  function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)+1}
  function fmt(v){return'RM '+parseFloat(v).toFixed(2)}
  function init(){
    load();
    document.getElementById('ncdStartDate').value=fmtDate(new Date());
    renderSaved();
    document.getElementById('ncdStartDate').addEventListener('change',updateRemaining);
    document.getElementById('ncdExpiryDate').addEventListener('change',updateRemaining);
  }
  function updateRemaining(){
    const s=document.getElementById('ncdStartDate').value,e=document.getElementById('ncdExpiryDate').value,el=document.getElementById('ncdRemainingDays');
    if(s&&e){const d=daysBetween(s,e);el.value=d>0?d+' days':'Invalid dates'}else el.value='';
  }
  function updateNcdHint(){
    const type=document.getElementById('ncdVehicleType').value,sel=document.getElementById('ncdPct'),hint=document.getElementById('ncdHint');
    sel.innerHTML='<option value="">— Select % —</option>';
    if(!type)return;
    NCD_OPTIONS[type].forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v+'%';sel.appendChild(o)});
    hint.textContent='Max NCD for '+type+': '+NCD_OPTIONS[type].slice(-1)[0]+'%';
  }
  function toggleOther(){document.getElementById('ncdOtherInsurerWrap').style.display=document.getElementById('ncdInsurer').value==='other'?'block':'none'}
  // Auto-fill Gross/Nett on the matching case card, if this plate already
  // has a case in the dashboard — so running the calculator for an existing
  // enquiry doesn't require re-typing the amounts into the case separately.
  function syncToCase(plate,customerPay,agentPay){
    const match=CASES.find(c=>c.plate===plate);
    if(!match){toast('Calculated · no matching case found for '+plate+' (amounts not synced)');return}
    match.gross=+customerPay.toFixed(2);
    match.nett=+agentPay.toFixed(2);
    save();
    logActivity('Synced NCD Calculator amounts',`${plate} · Gross ${fmt(match.gross)} / Nett ${fmt(match.nett)}`);
    toast('Synced to case '+plate+' · Gross '+fmt(match.gross)+' / Nett '+fmt(match.nett));
  }
  function calculate(){
    const plate=document.getElementById('ncdPlateNo').value.trim(),holder=document.getElementById('ncdHolderName').value.trim(),
          vType=document.getElementById('ncdVehicleType').value,ncdPct=document.getElementById('ncdPct').value,
          insurerVal=document.getElementById('ncdInsurer').value,otherIns=document.getElementById('ncdOtherInsurer').value.trim(),
          ncdAmt=parseFloat(document.getElementById('ncdAmount').value),
          startDate=document.getElementById('ncdStartDate').value,expiryDate=document.getElementById('ncdExpiryDate').value;
    if(!plate||!holder||!vType||!ncdPct||!insurerVal||isNaN(ncdAmt)||ncdAmt<=0||!startDate||!expiryDate){toast('Please fill in all required fields.');return}
    const insurer=insurerVal==='other'?(otherIns||'Other'):insurerVal;
    const remaining=daysBetween(startDate,expiryDate);
    if(remaining<=0){toast('Expiry date must be after endorsement start date.');return}
    const perDay=ncdAmt/365,gross=perDay*remaining,sst=gross*0.08,customerPay=gross+sst,
          commission=gross*0.10,nettBeforeSST=gross-commission,agentPay=nettBeforeSST+sst;
    lastResult={plate,holder,vType,ncdPct,insurer,ncdAmt,startDate,expiryDate,remaining,perDay,gross,sst,customerPay,commission,nettBeforeSST,agentPay,calcTime:new Date().toLocaleString('en-MY')};
    renderResults(lastResult);
    document.getElementById('ncdActionRow').style.display='flex';
    document.getElementById('ncdResultBadge').textContent=plate;
    syncToCase(plate,customerPay,agentPay);
    updateRemaining();
  }
  function renderResults(r){

      '<div style="padding:14px 22px 0;">'+

      '</div>'+
      '<div class="ncd-result-grid">'+

        '<div class="ncd-result-block"><div class="rb-label">Agent Nett Pay to Ins. Company</div><div class="rb-value">'+fmt(r.agentPay)+'</div><div class="rb-sub">Commission '+fmt(r.commission)+' deducted</div></div>'+

        '<tr><td>× '+r.remaining+' days = Gross</td><td>'+fmt(r.gross)+'</td></tr>'+
        '<tr><td>+ 8% SST</td><td>'+fmt(r.sst)+'</td></tr>'+
        '<tr class="highlight"><td>= Customer Total Due</td><td>'+fmt(r.customerPay)+'</td></tr>'+

      '<div class="ncd-breakdown-section-label">NETT CALCULATION (Agent Pays Insurance Co.)</div>'+
      '<table class="ncd-breakdown-table">'+
        '<tr><td>Gross</td><td>'+fmt(r.gross)+'</td></tr>'+
        '<tr><td>− 10% Commission</td><td>− '+fmt(r.commission)+'</td></tr>'+
        '<tr><td>Nett (Gross − Commission)</td><td>'+fmt(r.nettBeforeSST)+'</td></tr>'+
        '<tr><td>+ 8% SST on Gross</td><td>'+fmt(r.sst)+'</td></tr>'+
        '<tr class="highlight"><td>= Agent Nett Pay to Insurance Company</td><td>'+fmt(r.agentPay)+'</td></tr>'+
      '</table>'+
      '<div style="padding:6px 22px 12px;font-size:10px;color:#7a8fb0;">Calculated: '+r.calcTime+'</div>';
  }
  function saveRecord(){
    if(!lastResult)return;
    savedRecords.unshift({...lastResult,id:Date.now()});
    persist();renderSaved();toast('Record saved! ✓');
  }
  function renderSaved(){
    const list=document.getElementById('ncdSavedList'),card=document.getElementById('ncdSavedCard');
    if(!list||!card)return;
    if(savedRecords.length===0){card.style.display='none';return}
    card.style.display='block';
    list.innerHTML=savedRecords.map(r=>
      '<div class="ncd-saved-item">'+
        '<div><div class="si-plate">'+r.plate+' <span class="ncd-insurer-badge">'+r.insurer+'</span></div>'+
        '<div class="si-name">'+r.holder+' · '+r.vType+' · NCD '+r.ncdPct+'% · '+r.remaining+' days · '+r.startDate+'</div></div>'+
        '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">'+
          '<div class="si-amount"><span class="label">Customer</span>'+fmt(r.customerPay)+'</div>'+
          '<div class="si-amount" style="color:#1a6b3c;"><span class="label">Agent Nett</span>'+fmt(r.agentPay)+'</div>'+
          '<div style="display:flex;gap:6px;">'+
            '<button class="ncd-btn ncd-btn-primary ncd-btn-sm" onclick="NcdCalc.loadRecord('+r.id+')">Load</button>'+
            '<button class="ncd-btn ncd-btn-gold ncd-btn-sm" onclick="NcdCalc.showPdfModal('+r.id+')">PDF</button>'+
            '<button class="ncd-btn ncd-btn-danger ncd-btn-sm" onclick="NcdCalc.deleteRecord('+r.id+')">✕</button>'+
          '</div>'+
        '</div>'+
      '</div>'
    ).join('');
  }
  function loadRecord(id){
    const r=savedRecords.find(x=>x.id===id);if(!r)return;
    document.getElementById('ncdPlateNo').value=r.plate;
    document.getElementById('ncdHolderName').value=r.holder;
    document.getElementById('ncdVehicleType').value=r.vType;updateNcdHint();
    document.getElementById('ncdPct').value=r.ncdPct;
    const known=INSURER_LIST.some(i=>i.toLowerCase()===r.insurer.toLowerCase());
    document.getElementById('ncdInsurer').value=known?r.insurer:'other';
    toggleOther();
    if(!known)document.getElementById('ncdOtherInsurer').value=r.insurer;
    document.getElementById('ncdAmount').value=r.ncdAmt;
    document.getElementById('ncdStartDate').value=r.startDate;
    document.getElementById('ncdExpiryDate').value=r.expiryDate;
    updateRemaining();lastResult=r;renderResults(r);
    document.getElementById('ncdActionRow').style.display='flex';
    document.getElementById('ncdResultBadge').textContent=r.plate;
    window.scrollTo({top:0,behavior:'smooth'});toast('Record loaded ✓');
  }
  function deleteRecord(id){
    if(!confirm('Delete this record?'))return;
    savedRecords=savedRecords.filter(x=>x.id!==id);
    persist();renderSaved();toast('Deleted');
  }
  function clearForm(){
    ['ncdPlateNo','ncdHolderName','ncdAmount','ncdExpiryDate','ncdOtherInsurer'].forEach(id=>document.getElementById(id).value='');
    document.getElementById('ncdVehicleType').value='';
    document.getElementById('ncdPct').innerHTML='<option value="">— Select vehicle type first —</option>';
    document.getElementById('ncdInsurer').value='';
    document.getElementById('ncdOtherInsurerWrap').style.display='none';
    document.getElementById('ncdHint').textContent='';
    document.getElementById('ncdRemainingDays').value='';
    document.getElementById('ncdStartDate').value=fmtDate(new Date());
    document.getElementById('ncdResultContent').innerHTML='<div class="ncd-empty-state"><div class="big-icon">🧮</div><p>Fill in the form above and click <strong>Calculate Now</strong></p></div>';
    document.getElementById('ncdActionRow').style.display='none';
    document.getElementById('ncdResultBadge').textContent='Awaiting Input';
    lastResult=null;
  }
  function showPdfModal(id){pendingPdfRecord=id;document.getElementById('ncdPdfModal').classList.add('show')}
  function closePdfModal(){document.getElementById('ncdPdfModal').classList.remove('show');pendingPdfRecord=null}
  function triggerPDF(type){
    closePdfModal();
    const r=pendingPdfRecord!==null?savedRecords.find(x=>x.id===pendingPdfRecord):lastResult;
    if(r)buildPDF(r,type);
  }
  function buildPDF(r,type){
    const isC=type==='customer';
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:'mm',format:'a4'});
    const W=210,M=16,TW=178;
    doc.setFillColor(26,39,68);doc.rect(0,0,W,36,'F');
    doc.setFillColor(200,168,75);doc.rect(0,36,W,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(200,168,75);
    doc.text('CHIN HOCK AGENCY (M) SDN BHD',M,13);
    doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(160,171,192);
    doc.text('Motor Insurance  ·  Since 1985',M,20);
    doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(255,255,255);
    doc.text('NCD WITHDRAWAL CALCULATION',M,30);
    doc.setFillColor(isC?200:36,isC?168:52,isC?75:96);
    doc.roundedRect(W-M-36,10,36,9,2,2,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(7);doc.setTextColor(isC?26:200,isC?39:168,isC?68:75);
    doc.text(isC?'CUSTOMER COPY':'AGENT COPY',W-M-18,15.5,{align:'center'});
    let y=44;
    const IH=46;
    doc.setFillColor(245,237,218);doc.setDrawColor(200,168,75);doc.setLineWidth(0.4);
    doc.roundedRect(M,y,TW,IH,3,3,'FD');
    const c1=M+5,c2=M+TW/2+2,maxCW=TW/2-14;
    function ic(lbl,val,x,yy){
      doc.setFont('helvetica','normal');doc.setFontSize(6.5);doc.setTextColor(120,130,150);
      doc.text(lbl,x,yy);
      doc.setFont('helvetica','bold');doc.setFontSize(8.5);doc.setTextColor(26,39,68);
      doc.text(String(val),x,yy+5,{maxWidth:maxCW});
    }
    let iy=y+8;
    ic('Vehicle Plate No.',r.plate,c1,iy);ic('Policy Holder',r.holder,c2,iy);iy+=10;
    ic('Vehicle Type',r.vType.charAt(0).toUpperCase()+r.vType.slice(1),c1,iy);ic('Insurance Company',r.insurer,c2,iy);iy+=10;
    ic('NCD Percentage',r.ncdPct+'%',c1,iy);ic('NCD Amount in Policy',fmt(r.ncdAmt),c2,iy);iy+=10;
    ic('Endorsement Start Date',r.startDate,c1,iy);ic('Policy Expiry Date',r.expiryDate,c2,iy);
    y+=IH+4;
    doc.setFillColor(26,39,68);doc.roundedRect(M,y,55,13,3,3,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(160,171,192);doc.text('REMAINING DAYS',M+4,y+5);
    doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(200,168,75);doc.text(r.remaining+' days',M+4,y+11.5);
    y+=19;
    function sec(title,yy){
      doc.setFillColor(36,52,96);doc.rect(M,yy,TW,8,'F');
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(200,168,75);
      doc.text(title,M+4,yy+5.5);return yy+8;
    }
    let rt=false;
    function tr(lbl,val,yy,hi){
      rt=!rt;const rh=hi?9:8;
      doc.setFillColor(hi?232:rt?253:244,hi?212:rt?248:239,hi?138:rt?238:222);
      doc.rect(M,yy,TW,rh,'F');
      if(hi){doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(26,39,68)}
      else{doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(50,60,80)}
      doc.text(lbl,M+4,yy+rh-2);
      doc.text(val,W-M-4,yy+rh-2,{align:'right'});
      return yy+rh;
    }
    rt=false;
    y=sec('GROSS CALCULATION  —  AMOUNT PAYABLE',y);
    y=tr('NCD Amount in Policy',fmt(r.ncdAmt),y,false);
    y=tr('/ 365 days  =  Per Day Rate','RM '+parseFloat(r.perDay).toFixed(4),y,false);
    y=tr('x '+r.remaining+' days  =  Gross',fmt(r.gross),y,false);
    y=tr('+ 8% SST',fmt(r.sst),y,false);
    y=tr('TOTAL AMOUNT PAYABLE',fmt(r.customerPay),y,true);
    if(!isC){
      y+=5;rt=false;
      y=sec('NETT CALCULATION  —  AGENT PAYS TO INSURANCE COMPANY',y);
      y=tr('Gross',fmt(r.gross),y,false);
      y=tr('- 10% Agent Commission','- '+fmt(r.commission),y,false);
      y=tr('Nett  (Gross - Commission)',fmt(r.nettBeforeSST),y,false);
      y=tr('+ 8% SST on Gross (not reduced by commission)',fmt(r.sst),y,false);
      y=tr('AGENT NETT PAY TO INSURANCE COMPANY',fmt(r.agentPay),y,true);
    }
    y+=6;
    const sw=isC?TW:(TW-5)/2;
    doc.setFillColor(26,39,68);doc.roundedRect(M,y,sw,18,3,3,'F');
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(160,171,192);doc.text('TOTAL AMOUNT PAYABLE',M+4,y+6);
    doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(200,168,75);doc.text(fmt(r.customerPay),M+4,y+15);
    if(!isC){
      doc.setFillColor(26,107,60);doc.roundedRect(M+sw+5,y,sw,18,3,3,'F');
      doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(160,220,170);doc.text('AGENT NETT PAY TO INS. CO.',M+sw+9,y+6);
      doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(255,255,255);doc.text(fmt(r.agentPay),M+sw+9,y+15);
    }
    y+=24;
    doc.setFillColor(255,243,242);doc.setDrawColor(192,57,43);doc.setLineWidth(0.5);
    doc.roundedRect(M,y,TW,24,2,2,'FD');
    doc.setFillColor(192,57,43);doc.rect(M,y,3,24,'F');
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(192,57,43);
    doc.text('IMPORTANT',M+6,y+7);
    doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(60,40,40);
    doc.text('We will only process the NCD Withdrawal upon confirmation of payment received.',M+6,y+13,{maxWidth:TW-10});
    doc.setFont('helvetica','bold');doc.setTextColor(192,57,43);
    doc.text('NCD Withdrawal requires 1 working day to update the system. Please avoid urgent cases.',M+6,y+20,{maxWidth:TW-10});
    y+=30;
    if(isC){
      doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(26,39,68);
      doc.text('PAYMENT DETAILS',M,y+5);
      doc.setFillColor(200,168,75);doc.rect(M,y+7,TW,0.8,'F');
      y+=12;
      doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(60,70,90);
      doc.text('This is our payment details, kindly inform me once payment is done. Thank you ❤',M,y+5,{maxWidth:TW});
      doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(192,57,43);
      doc.text('* Please remark vehicle no. as reference *',M,y+12);
      y+=18;
      const imgW=90,imgH=90;
      if(y+imgH>272){doc.addPage();y=15;}
      const imgX=M+(TW-imgW)/2;doc.addImage('data:image/jpeg;base64,'+PAYMENT_B64,'JPEG',imgX,y,imgW,imgH);
      y+=imgH+4;
    }
    const fy=isC&&y>260?y+5:277;
    if(isC&&y>260){
      doc.setFillColor(26,39,68);doc.rect(0,fy,W,18,'F');
      doc.setFillColor(200,168,75);doc.rect(0,fy-1.5,W,1.5,'F');
    } else {
      doc.setFillColor(26,39,68);doc.rect(0,277,W,20,'F');
      doc.setFillColor(200,168,75);doc.rect(0,275.5,W,1.5,'F');
    }
    doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(116,140,176);
    doc.text('CHIN HOCK AGENCY (M) SDN BHD  ·  '+(isC?'Customer Copy':'Agent Internal Copy')+'  ·  Calculator For NCD Withdrawal',W/2,(isC&&y>260?fy:277)+7,{align:'center'});
    doc.setTextColor(200,168,75);
    doc.text('Generated: '+(r.calcTime||new Date().toLocaleString('en-MY')),W/2,(isC&&y>260?fy:277)+13,{align:'center'});
    doc.save(r.plate+'_NCD_Withdrawal_'+(isC?'Customer':'Agent')+'.pdf');
    toast((isC?'Customer':'Agent')+' PDF downloaded ✓');
  }
  return {init,updateNcdHint,toggleOther,calculate,clearForm,saveRecord,loadRecord,deleteRecord,showPdfModal,closePdfModal,triggerPDF};
})();

function emptyHTML(ic,t,s){return `<div class="empty glass"><div class="ic">${ic}</div><div style="font-weight:640;color:var(--navy)">${t}</div><div style="font-size:13px;margin-top:4px">${s}</div></div>`}
let settingsTab='tools';
function setSettingsTab(t){settingsTab=t;render()}
function viewSettings(){
  if(!isAdmin()&&settingsTab!=='tools')settingsTab='tools';
  const tabs=`<div class="seg" style="margin-bottom:14px">
    <button class="${settingsTab==='tools'?'on':''}" onclick="setSettingsTab('tools')">🛠️ Tools</button>
    ${isAdmin()?`<button class="${settingsTab==='activity'?'on':''}" onclick="setSettingsTab('activity')">📜 Activity Log</button>
    <button class="${settingsTab==='users'?'on':''}" onclick="setSettingsTab('users')">👥 Manage Users</button>
    <button class="${settingsTab==='trash'?'on':''}" onclick="setSettingsTab('trash')">🗑️ Trash</button>`:''}
  </div>`;
  const page=settingsTab==='users'?viewManageUsers():settingsTab==='activity'?viewActivityLog():settingsTab==='trash'?viewTrash():viewSettingsTools();
  return tabs+page;
}
function viewSettingsTools(){
  return `<div class="sect" style="max-width:480px">
    <label class="h">Backup &amp; restore</label>
    <div class="hint" style="margin:6px 0 12px">Export a copy of all cases, or bring one back in.</div>
    <div class="grid2">
      <button class="mini" onclick="exportData()">⬇︎ Backup</button>
      ${isAdmin()?`<button class="mini" onclick="document.getElementById('imp').click()">⬆︎ Restore</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importData(event)">`:''}
    </div>
  </div>
  <div class="sect" style="max-width:480px">
    <label class="h">Google Drive (case folders)</label>
    <div class="hint" style="margin:6px 0 12px" id="driveStatus">${driveReady()?'':'Not set up yet — an admin needs to create a Google OAuth Client ID once (see the comment at the top of the Drive section in the code) and paste it into DRIVE_CLIENT_ID.'}</div>
    <button class="mini" onclick="connectDrive()">🔗 Connect Drive</button>
    <div class="hint" style="margin-top:10px">Once connected, new cases automatically get a Drive folder created under the team's existing "Endorsement" folder (matched by Endorsement Type). Existing cases without one yet can get one from the "📁 Create Drive Folder" button inside the case.</div>
  </div>`;
}
function viewActivityLog(){
  if(!ACTIVITY.length)return emptyHTML('📜','No activity yet','Adding, editing, deleting, and status changes will show up here.');
  const rows=[...ACTIVITY].reverse();
  return `<div class="list">${rows.map(a=>`<div class="card glass" style="cursor:default;border-left-color:var(--line)">
    <div class="cmain"><h3 style="font-size:14px">${esc(a.action)}</h3><div class="cdesc" style="border:0;padding:0;margin-top:4px">${esc(a.detail||'')}</div>
      <div class="cmeta"><span class="tag">${a.ts}</span><span class="tag">👤 ${esc(a.who)}</span></div></div></div>`).join('')}</div>`;
}
function viewManageUsers(){
  return `<div class="hint" style="background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px">👥 Adding or removing team logins is done directly in Supabase — this keeps passwords out of the app's own code entirely.</div>
    <div class="sect" style="max-width:520px">
      <label class="h">Current admins</label>
      <div class="hint" style="margin:6px 0 14px">${ADMIN_EMAILS.join(', ')}</div>
      <label class="h">Add a new team login</label>
      <div class="hint" style="margin:6px 0 14px">Go to your Supabase project → <b>Authentication → Users → Add user</b>, set their email + a password, and share it with them directly.</div>
      <label class="h" style="margin-top:18px;display:block">Approved names</label>
      <div class="hint" style="margin:6px 0 10px">Non-admin logins must type one of these names exactly (not case-sensitive) to get in — this is what stops a shared login being used under someone else's name.</div>
      <div style="display:flex;gap:8px;margin-bottom:10px">
        <input id="newTeamName" type="text" placeholder="Add a name…" style="flex:1;font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:9px" onkeydown="if(event.key==='Enter')addTeamName()">
        <button class="mini go" onclick="addTeamName()">Add</button>
      </div>
      <div>${TEAM_NAMES.length?TEAM_NAMES.map(n=>`<span style="display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0;padding:6px 10px;background:var(--glass-strong);border-radius:20px;font-size:12.5px">${esc(n)}<button onclick="removeTeamName('${n.replace(/'/g,"\\'")}')" style="border:0;background:transparent;cursor:pointer;color:var(--e-followup);font-weight:700">✕</button></span>`).join(''):'<span class="hint">No names added yet — no one but admin can log in until you add some.</span>'}</div>
    </div>`;
}
function addTeamName(){
  const inp=document.getElementById('newTeamName');if(!inp)return;
  const v=inp.value.trim();if(!v)return;
  if(TEAM_NAMES.some(n=>n.toLowerCase()===v.toLowerCase())){toast('Already in the list');return}
  TEAM_NAMES.push(v);save();render();toast('Added '+v);
}
function removeTeamName(name){
  if(!confirm('Remove "'+name+'" from the approved list? They won\'t be able to log in until re-added.'))return;
  TEAM_NAMES=TEAM_NAMES.filter(n=>n!==name);save();render();toast('Removed');
}
function viewTrash(){
  if(!isAdmin())return emptyHTML('🔒','Admins only','Only the admin account can view and restore deleted cases.');
  if(!TRASH.length)return emptyHTML('🗑️','Trash is empty','Deleted cases appear here and can be restored.');
  const rows=[...TRASH].sort((a,b)=>(b.deletedAt||'').localeCompare(a.deletedAt||''));
  return `<div class="hint" style="background:rgba(255,255,255,.5);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px">🗑️ Deleted cases — restore if this was a mistake, or remove permanently.</div>
    <div class="list">${rows.map(c=>`<div class="card glass" style="cursor:default;border-left-color:var(--line)"><div class="cmain"><h3>${esc(c.plate)}</h3><span class="type-pill">${esc(c.type)}</span>
      <div class="cmeta"><span class="tag">Deleted ${c.deletedAt||''}${c.deletedBy?' by '+esc(c.deletedBy):''}</span></div>
      <div class="cmeta" style="margin-top:9px">
        <button class="mini go" onclick="restoreFromTrash('${c.id}')">↺ Restore</button>
        <button class="mini undo" style="color:var(--e-followup)" onclick="permanentlyDelete('${c.id}')">✕ Delete permanently</button>
      </div></div></div>`).join('')}</div>`;
}

const NAME_KEY='ed_my_name';
function myName(){return localStorage.getItem(NAME_KEY)||''}
function askName(){const cur=myName();const n=prompt('Your name (shown on everything you do):',cur);
  if(n&&n.trim()){localStorage.setItem(NAME_KEY,n.trim());renderWhoAmI()}return myName()}
function renderWhoAmI(){const el=document.getElementById('whoAmI');if(!el)return;
  el.textContent=myName()?('You: '+myName()):'Set your name';}
function exportData(){
  if(!myName())askName();
  const payload={cases:CASES,trash:TRASH,activity:ACTIVITY,teamNames:TEAM_NAMES,customTypes:CUSTOM_TYPES,exportedAt:new Date().toISOString(),exportedBy:myName()};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='endorsement_backup_'+toISO(new Date())+'.json';a.click();
  toast('Backup exported'+(myName()?' as '+myName():''));
}
function importData(e){
  if(!isAdmin()){toast('Only admin can restore from a backup file');e.target.value='';return}
  const f=e.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{
    const d=JSON.parse(rd.result);
    if(!d||!Array.isArray(d.cases)){toast('That file does not look like a valid backup');return}
    if(!confirm('Replace all current data with this backup ('+d.cases.length+' cases)? This cannot be undone.'))return;
    CASES=d.cases;TRASH=Array.isArray(d.trash)?d.trash:[];ACTIVITY=Array.isArray(d.activity)?d.activity:[];TEAM_NAMES=Array.isArray(d.teamNames)?d.teamNames:[];CUSTOM_TYPES=Array.isArray(d.customTypes)?d.customTypes:[];
    save();render();toast('Backup restored');
  }catch(err){toast('Could not read that file')}};
  rd.readAsText(f);e.target.value='';
}

// ============================================================
// Boot
// ============================================================
boot();
</script>
